name: Tests

# Runs the unit tests of the MCP server and of the Qt plugin.
# It does not start an app: runs against Status desktop or a phone belong to the CI of the app.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Qt version of the Status app. The plugin uses private Qt symbols, so an older Qt does not link.
  QT_VERSION: 6.11.0
  AQT_VERSION: 3.3.0

jobs:
  server:
    name: MCP server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - name: The server file parses
        run: node --check index.mjs
      - name: Unit tests
        run: npm test --if-present

  plugin:
    name: Qt plugin tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build tools and the libraries Qt needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake g++ make libgl1-mesa-dev \
            libglib2.0-0t64 libxkbcommon0 libfontconfig1 libdbus-1-3 libegl1
      - name: Qt from the cache
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/qt
          key: qt-${{ env.QT_VERSION }}-linux_gcc_64-aqt-${{ env.AQT_VERSION }}
      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: pipx run --spec "aqtinstall==$AQT_VERSION" aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O ~/qt
      - name: Build the tests
        run: |
          cmake -S qt-plugin/generic-plugin/tests -B build -DCMAKE_PREFIX_PATH="$HOME/qt/$QT_VERSION/gcc_64"
          cmake --build build --parallel 4
      - name: Run the tests
        run: ctest --test-dir build --output-on-failure
